name: Flight reference validation
on:
  push:
    branches: [flight-stages-3-to-8]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -e .
      - name: Check MATLAB syntax
        run: |
          python -m pip install miss-hit
          mh_lint --matlab 2022a matlab
      - run: pytest -q
      - name: Export machine-readable references
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in sorted(Path('expected').glob('*.json')):
              print('FLIGHT_JSON '+file.name+' '+json.dumps(json.loads(file.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-fixtures
          path: expected/
