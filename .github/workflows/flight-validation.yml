name: Flight reference validation
on:
  push:
    branches: [flight-stages-3-to-8]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -e .
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-fixtures
          path: expected/
